---
version: "2.0"

services:
  postgres:
    image: postgres:15-alpine
    env:
      - POSTGRES_DB=transcribe_db
      - POSTGRES_USER=transcribe_user
      - POSTGRES_PASSWORD=transcribe_pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - port: 5432
        proto: tcp
        to:
          - service: api
          - service: worker
    params:
      storage:
        data:
          mount: /var/lib/postgresql/data
          readOnly: false

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "allkeys-lru"
    expose:
      - port: 6379
        proto: tcp
        to:
          - service: api
          - service: worker
    params:
      storage:
        redis-data:
          mount: /data
          readOnly: false

  api:
    image: python:3.11-slim
    env:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1
      - GITHUB_PAT=__REPLACE_WITH_GITHUB_PAT__
      - GIT_REPO=https://github.com/garrettmucha/transcribe.git
      - GIT_REF=main
      - DATABASE_URL=postgresql+asyncpg://transcribe_user:transcribe_pass@postgres:5432/transcribe_db
      - REDIS_URL=redis://redis:6379
      - STORAGE_ROOT=/storage
      - MODELS_DIR=/models
      - WHISPER_CACHE_DIR=/models
      - TEMP_DIR=/tmp/transcribe
      - PROMETHEUS_ENABLE=true
      - FILE_RETENTION_DAYS=30
      - MONTHLY_CAP_MIN=100
      - MAX_DURATION_MIN=20
      - MAX_FILE_SIZE_MB=25
      - ENABLE_DIARIZATION=true
    command:
      - /bin/sh
      - -c
      - |
          set -eu
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "GITHUB_PAT must be set to clone ${GIT_REPO:-https://github.com/garrettmucha/transcribe.git}" >&2
            exit 1
          fi
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential ffmpeg libsndfile1 git curl
            rm -rf /var/lib/apt/lists/*
          fi
          APP_DIR="/opt/app"
          REPO_URL="${GIT_REPO:-https://github.com/garrettmucha/transcribe.git}"
          rm -rf "${APP_DIR}"
          AUTH_URL="${REPO_URL}"
          case "${REPO_URL}" in
            https://*) AUTH_URL="https://${GITHUB_PAT}@${REPO_URL#https://}" ;;
            http://*) AUTH_URL="http://${GITHUB_PAT}@${REPO_URL#http://}" ;;
          esac
          git clone "${AUTH_URL}" "${APP_DIR}"
          cd "${APP_DIR}"
          if [ -n "${GIT_REF:-}" ]; then
            git checkout "${GIT_REF}"
          fi
          git remote set-url origin "${REPO_URL}"
          unset GITHUB_PAT
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          export PYTHONPATH="${APP_DIR}"
          mkdir -p "${MODELS_DIR:-/models}" "${STORAGE_ROOT:-/storage}" "${TEMP_DIR:-/tmp/transcribe}"
          exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - port: 8000
        proto: tcp
        to:
          - service: traefik
    params:
      storage:
        storage:
          mount: /storage
          readOnly: false
        models:
          mount: /models
          readOnly: false
    depends-on:
      - service: postgres
      - service: redis

  worker:
    image: python:3.11-slim
    env:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1
      - GITHUB_PAT=__REPLACE_WITH_GITHUB_PAT__
      - GIT_REPO=https://github.com/garrettmucha/transcribe.git
      - GIT_REF=main
      - DATABASE_URL=postgresql+asyncpg://transcribe_user:transcribe_pass@postgres:5432/transcribe_db
      - REDIS_URL=redis://redis:6379
      - STORAGE_ROOT=/storage
      - MODELS_DIR=/models
      - WHISPER_CACHE_DIR=/models
      - TEMP_DIR=/tmp/transcribe
      - FILE_RETENTION_DAYS=30
    command:
      - /bin/sh
      - -c
      - |
          set -eu
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "GITHUB_PAT must be set to clone ${GIT_REPO:-https://github.com/garrettmucha/transcribe.git}" >&2
            exit 1
          fi
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential ffmpeg libsndfile1 git curl
            rm -rf /var/lib/apt/lists/*
          fi
          APP_DIR="/opt/app"
          REPO_URL="${GIT_REPO:-https://github.com/garrettmucha/transcribe.git}"
          rm -rf "${APP_DIR}"
          AUTH_URL="${REPO_URL}"
          case "${REPO_URL}" in
            https://*) AUTH_URL="https://${GITHUB_PAT}@${REPO_URL#https://}" ;;
            http://*) AUTH_URL="http://${GITHUB_PAT}@${REPO_URL#http://}" ;;
          esac
          git clone "${AUTH_URL}" "${APP_DIR}"
          cd "${APP_DIR}"
          if [ -n "${GIT_REF:-}" ]; then
            git checkout "${GIT_REF}"
          fi
          git remote set-url origin "${REPO_URL}"
          unset GITHUB_PAT
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          export PYTHONPATH="${APP_DIR}"
          mkdir -p "${MODELS_DIR:-/models}" "${STORAGE_ROOT:-/storage}" "${TEMP_DIR:-/tmp/transcribe}"
          exec celery -A celery_main:celery_app worker --loglevel=info
    params:
      storage:
        storage:
          mount: /storage
          readOnly: false
        models:
          mount: /models
          readOnly: false
    depends-on:
      - service: postgres
      - service: redis

  traefik:
    image: traefik:v2.10
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.toml
      - --providers.file.watch=true
    expose:
      - port: 8080
        as: 80
        proto: tcp
        to:
          - global: true
    files:
      - path: /etc/traefik/dynamic.toml
        content: |
          [http.routers.api]
            rule = "PathPrefix(`/`)"
            service = "backend"
          [http.services.backend.loadBalancer]
            [[http.services.backend.loadBalancer.servers]]
              url = "http://api:8000"
    depends-on:
      - service: api

profiles:
  compute:
    postgres:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage:
          - size: 1Gi
          - name: data
            size: 50Gi
            attributes:
              persistent: true
    redis:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 2Gi
        storage:
          - size: 1Gi
          - name: redis-data
            size: 5Gi
            attributes:
              persistent: true
    api:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
          - size: 1Gi
          - name: storage
            size: 100Gi
            attributes:
              persistent: true
          - name: models
            size: 20Gi
            attributes:
              persistent: true
    worker:
      resources:
        cpu:
          units: 8
        memory:
          size: 16Gi
        storage:
          - size: 1Gi
          - name: storage
            size: 100Gi
            attributes:
              persistent: true
          - name: models
            size: 20Gi
            attributes:
              persistent: true
    traefik:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 512Mi
  placement:
    akash:
      attributes:
        organization: ovrclk.com
      signedBy:
        anyOf:
          - "akash1vz375dkt0c60annyp6mkzeejfq0qpyevhseu05"
      pricing:
        postgres:
          denom: uakt
          amount: 1000
        redis:
          denom: uakt
          amount: 500
        api:
          denom: uakt
          amount: 4000
        worker:
          denom: uakt
          amount: 6000
        traefik:
          denom: uakt
          amount: 500

deployment:
  postgres:
    akash:
      profile: postgres
      count: 1
  redis:
    akash:
      profile: redis
      count: 1
  api:
    akash:
      profile: api
      count: 1
  worker:
    akash:
      profile: worker
      count: 1
  traefik:
    akash:
      profile: traefik
      count: 1
